[mod]
id = "create_horizon"
version = "0.1.0"
priority = 100

# The commit it was checked against. It uses only the named hook points, so
# the launcher builds it on any Horizon with NATIVE_HOOKS_API 80 or later.
[compatibility]
horizon_revision = "183b53f0eb05a3e02584fd42a1afc2d6231837d8"

# The glue: crate::game::create_mod.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "create_mod"
source = "runtime.rs"

# Create's kinetics, in a crate of their own (compiled once, kept).
[[crate]]
id = "kinetics"
path = "kinetics"

[[injection]]
id = "listed"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "listed.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "new_block_entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "new_block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "&mut *entity" },
]

[[injection]]
id = "ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
]

[[injection]]
id = "update_tag"
hook = "block_entity_update_tag"
hook_version = 1
kind = "HEAD"
helper = "update_tag.rs"
bindings = [
  { name = "entity", ty = "&horizon_client::containers::ModBlockEntity", value = "entity" },
  { name = "tag", ty = "&mut Option<horizon_world::nbt::Compound>", value = "&mut *tag" },
]

[[injection]]
id = "submit"
hook = "block_entity_submit"
hook_version = 1
kind = "HEAD"
helper = "submit.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "block", ty = "&str", value = "block" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "entity", ty = "&horizon_client::containers::ModBlockEntity", value = "entity" },
  { name = "draw", ty = "&mut crate::game::native_block_entity_draw::BlockEntityDraw", value = "&mut *draw" },
]

[[injection]]
id = "bounds"
hook = "block_entity_render_bounding_box"
hook_version = 1
kind = "HEAD"
helper = "bounds.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "bounds", ty = "&mut [f32; 6]", value = "&mut *bounds" },
]

[[injection]]
id = "click"
hook = "right_click_block"
hook_version = 1
kind = "HEAD"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "placement"
hook = "state_for_placement"
hook_version = 1
kind = "HEAD"
helper = "placement.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "&*self" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "context", ty = "&horizon_world::level::PlacementContext", value = "context" },
  { name = "answer", ty = "&mut Option<Option<horizon_world::registry::BlockStateId>>", value = "&mut *answer" },
]

[[injection]]
id = "changed"
hook = "block_changed"
hook_version = 1
kind = "HEAD"
helper = "changed.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "&*self" },
  { name = "dimension", ty = "horizon_world::level::Dimension", value = "dimension" },
  { name = "pos", ty = "horizon_core::position::BlockPos", value = "pos" },
  { name = "old", ty = "horizon_world::registry::BlockStateId", value = "old" },
  { name = "new", ty = "horizon_world::registry::BlockStateId", value = "new" },
]

[[injection]]
id = "level_tick"
hook = "level_tick_pre"
hook_version = 1
kind = "HEAD"
helper = "level_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
]

[[injection]]
id = "stopping"
hook = "server_stopping"
hook_version = 1
kind = "HEAD"
helper = "stopping.rs"
bindings = []
